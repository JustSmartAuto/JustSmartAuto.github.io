[project]
name = "svg-overlay-py"
version = "26.11.4.1"
description = "SvgOverlayPy 叠加图生成器（图片 + 同名 SVG → 3 倍分辨率 JPEG 叠加图）"
requires-python = ">=3.13"
dependencies = [
    "pywebview>=5.4",
    "pillow>=10",
    "tkinterdnd2>=0.7.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6",
]

[project.scripts]
svg-overlay = "svgoverlay.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
