[project]
name = "LocalFileDropShellPy"
version = "26.11.5.1"
description = "面向工控机/调试机的本地文件与文件夹传送，客户端与服务端一体；支持 TightVNC 文件传输通道复用，单工时自动启用喷泉码"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "pywebview>=5",
    "aiohttp>=3.9",
    "tkinterdnd2>=0.7.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6",
]

[project.scripts]
local-drop-shell = "localdropshell.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
