[project]
name = "RemoteRipplePy"
version = "1.2.0"
description = "Pure Python RemoteRipple-compatible VNC client with Tkinter and TightVNC file transfer"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pythonnet>=3.2.1,<3.3",
    "tkinterdnd2>=0.7.0,<0.8",
    "pillow>=12,<14",
]

[project.scripts]
remoteripplepy = "remoteripple.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remoteripple = ["assets/*.ico"]
