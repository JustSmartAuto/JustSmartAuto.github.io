[project]
name = "RemoteRipplePy"
version = "1.2.0"
description = "RemoteRipple compatible Python/Tkinter client powered by RemoteCore SDK through pythonnet"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pythonnet>=3.2.1,<3.3",
    "tkinterdnd2>=0.7.0,<0.8",
    "pillow>=12,<14",
]

[project.scripts]
remoteripplepy = "remoteripple.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
