[project]
name = "ImageDiffPy"
version = "26.11.7.1"
description = "图像差分 diff 器（Python Tk + odiff.exe）"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "tkinterdnd2>=0.7.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6",
]

[project.scripts]
odiff-diff = "odiffdiff.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
